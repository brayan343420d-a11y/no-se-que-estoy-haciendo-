name: MIR builds for Android (Winlator / Termux)

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish (win-x64, self-contained)
        working-directory: src/MadnessInteractiveReloaded
        shell: pwsh
        run: >
          dotnet publish MIR.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -o ../../out/win-x64

      - name: Check base.waa was packed
        shell: pwsh
        run: |
          if (!(Test-Path out/win-x64/resources/base.waa)) { Write-Error "base.waa missing: post-publish pack step failed"; exit 1 }
          Get-ChildItem out/win-x64 | Select-Object -First 30

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/win-x64/* -DestinationPath MIR-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MIR-win-x64
          path: MIR-win-x64.zip

  linux-arm64:
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Make post-publish pack step use ./MIR on Linux
        run: sed -i 's|Command="MIR --mode|Command="./MIR --mode|g' src/MadnessInteractiveReloaded/MIR.csproj

      - name: Publish (linux-arm64, self-contained)
        working-directory: src/MadnessInteractiveReloaded
        run: dotnet publish MIR.csproj -c Release -r linux-arm64 --self-contained true -o ../../out/linux-arm64

      - name: Check base.waa was packed
        run: test -f out/linux-arm64/resources/base.waa

      - name: Zip
        run: cd out/linux-arm64 && chmod +x MIR && zip -r ../../MIR-linux-arm64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: MIR-linux-arm64
          path: MIR-linux-arm64.zip
